name: Deploy to Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject secrets into index.html
        run: |
          sed -i "s/YOUR_OMDB_API_KEY/${{ secrets.OMDB_KEY }}/g" index.html
          sed -i "s/YOUR_FIREBASE_API_KEY/${{ secrets.FB_API_KEY }}/g" index.html
          sed -i "s/YOUR_PROJECT.firebaseapp.com/${{ secrets.FB_AUTH_DOMAIN }}/g" index.html
          sed -i "s/YOUR_PROJECT_ID/${{ secrets.FB_PROJECT_ID }}/g" index.html
          sed -i "s/YOUR_PROJECT.appspot.com/${{ secrets.FB_STORAGE_BUCKET }}/g" index.html
          sed -i "s/YOUR_SENDER_ID/${{ secrets.FB_MESSAGING_SENDER_ID }}/g" index.html
          sed -i "s/YOUR_APP_ID/${{ secrets.FB_APP_ID }}/g" index.html

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
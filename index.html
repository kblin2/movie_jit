<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #F5F0E8; --ink: #1A1714; --muted: #6B6560;
    --accent: #C8432A; --accent-light: #F2E0DB;
    --gold: #C9902A;
    --green: #3A7D5A; --green-light: #DDF0E8;
    --border: rgba(26,23,20,0.12); --card-bg: #FDFAF5;
  }
  body { background: var(--cream); color: var(--ink); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

  header { max-width: 800px; margin: 0 auto; padding: 3rem 1.5rem 1.5rem; border-bottom: 1px solid var(--border); }
  h1 { font-family: 'DM Serif Display', serif; font-size: clamp(2rem,5vw,3rem); line-height: 1; letter-spacing: -0.02em; margin-bottom: 0.3rem; cursor: default; user-select: none; }
  .subtitle { color: var(--muted); font-size: 0.9rem; font-weight: 300; margin-bottom: 1.5rem; }

  .search-wrap { position: relative; }
  .add-form { display: flex; gap: 0.5rem; }
  .add-form input { flex: 1; padding: 0.7rem 1rem; border: 1px solid var(--border); background: var(--card-bg); border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; color: var(--ink); outline: none; transition: border-color 0.15s; }
  .add-form input:focus { border-color: var(--accent); }
  .add-form input::placeholder { color: var(--muted); }
  .btn-add { padding: 0.7rem 1.4rem; background: var(--accent); color: white; border: none; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background 0.15s, transform 0.1s; }
  .btn-add:hover { background: #a8361f; }
  .btn-add:active { transform: scale(0.97); }

  .admin-badge { display: inline-flex; align-items: center; gap: 4px; background: #1A1714; color: #F5F0E8; font-size: 0.72rem; font-weight: 500; padding: 0.2rem 0.6rem; border-radius: 4px; margin-left: 0.5rem; vertical-align: middle; }

  .admin-overlay { position: fixed; inset: 0; background: rgba(26,23,20,0.5); display: flex; align-items: center; justify-content: center; z-index: 600; padding: 1rem; }
  .admin-modal { background: var(--card-bg); border-radius: 14px; padding: 2rem; max-width: 340px; width: 100%; box-shadow: 0 20px 60px rgba(26,23,20,0.2); animation: popIn 0.18s ease; }
  .admin-modal h2 { font-family: 'DM Serif Display', serif; font-size: 1.4rem; margin-bottom: 0.4rem; }
  .admin-modal p { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; line-height: 1.5; }
  .admin-modal input { width: 100%; padding: 0.65rem 1rem; border: 1px solid var(--border); border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; margin-bottom: 0.5rem; outline: none; background: var(--cream); color: var(--ink); }
  .admin-modal input:focus { border-color: var(--accent); }
  .admin-error { font-size: 0.8rem; color: var(--accent); margin-bottom: 0.6rem; min-height: 1.1em; }
  .admin-modal-btns { display: flex; gap: 0.5rem; }
  .btn-admin-confirm { flex: 1; padding: 0.65rem; background: var(--ink); color: white; border: none; border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500; cursor: pointer; }
  .btn-admin-confirm:hover { background: #333; }
  .btn-admin-cancel { padding: 0.65rem 1rem; border: 1px solid var(--border); border-radius: 7px; background: transparent; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; color: var(--muted); cursor: pointer; }
  .btn-admin-cancel:hover { background: rgba(26,23,20,0.06); }

  .autocomplete { position: absolute; top: calc(100% + 4px); left: 0; right: 60px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; z-index: 300; overflow: hidden; box-shadow: 0 8px 24px rgba(26,23,20,0.12); }
  .ac-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; cursor: pointer; transition: background 0.1s; border-bottom: 1px solid var(--border); }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover { background: var(--accent-light); }
  .ac-poster { width: 36px; height: 52px; object-fit: cover; border-radius: 3px; flex-shrink: 0; background: rgba(26,23,20,0.08); }
  .ac-poster-placeholder { width: 36px; height: 52px; border-radius: 3px; flex-shrink: 0; background: rgba(26,23,20,0.08); display:flex; align-items:center; justify-content:center; font-size:1.2rem; }
  .ac-title { font-weight: 500; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ac-year { font-size: 0.75rem; color: var(--muted); }
  .ac-searching { padding: 0.75rem; font-size: 0.85rem; color: var(--muted); text-align: center; }

  .preview-overlay { position: fixed; inset: 0; background: rgba(26,23,20,0.55); display: flex; align-items: center; justify-content: center; z-index: 400; padding: 1rem; }
  .preview-card { background: var(--card-bg); border-radius: 14px; padding: 1.5rem; max-width: 440px; width: 100%; box-shadow: 0 20px 60px rgba(26,23,20,0.2); animation: popIn 0.2s ease; }
  @keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .preview-inner { display: flex; gap: 1rem; margin-bottom: 1rem; }
  .preview-poster { width: 80px; height: 118px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .preview-poster-ph { width: 80px; height: 118px; border-radius: 6px; background: rgba(26,23,20,0.08); display:flex; align-items:center; justify-content:center; font-size:2rem; flex-shrink:0; }
  .preview-meta h3 { font-family: 'DM Serif Display', serif; font-size: 1.2rem; margin-bottom: 0.3rem; line-height: 1.2; }
  .preview-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 0.5rem; }
  .tag { font-size: 0.7rem; padding: 2px 7px; border-radius: 10px; background: rgba(26,23,20,0.08); color: var(--muted); }
  .preview-plot { font-size: 0.82rem; color: var(--muted); line-height: 1.5; max-height: 80px; overflow-y: auto; }
  .preview-actions { display: flex; gap: 0.5rem; }
  .btn-confirm { flex: 1; padding: 0.65rem; background: var(--accent); color: white; border: none; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500; cursor: pointer; }
  .btn-confirm:hover { background: #a8361f; }
  .btn-cancel { padding: 0.65rem 1rem; border: 1px solid var(--border); border-radius: 6px; background: transparent; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; color: var(--muted); cursor: pointer; }
  .btn-cancel:hover { background: rgba(26,23,20,0.06); }

  .tabs { max-width: 800px; margin: 0 auto; padding: 1rem 1.5rem 0; display: flex; gap: 0.25rem; }
  .tab { padding: 0.45rem 1rem; border-radius: 20px; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.15s; border: 1px solid transparent; color: var(--muted); background: transparent; }
  .tab.active { background: var(--ink); color: white; }
  .tab:not(.active):hover { background: rgba(26,23,20,0.06); color: var(--ink); }
  .count-badge { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; font-size: 10px; margin-left: 4px; background: rgba(26,23,20,0.12); color: var(--muted); }
  .tab.active .count-badge { background: rgba(255,255,255,0.25); color: white; }

  .toolbar { max-width: 800px; margin: 0 auto; padding: 0.75rem 1.5rem 0; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .sort-label { font-size: 0.78rem; color: var(--muted); font-weight: 500; margin-right: 0.25rem; }
  .sort-btn { padding: 0.3rem 0.75rem; border-radius: 20px; font-size: 0.78rem; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: 'DM Sans', sans-serif; transition: all 0.15s; white-space: nowrap; }
  .sort-btn.active { background: var(--ink); color: white; border-color: var(--ink); }
  .sort-btn:not(.active):hover { background: rgba(26,23,20,0.06); color: var(--ink); }

  main { max-width: 800px; margin: 0 auto; padding: 1.25rem 1.5rem 4rem; }
  .loading { text-align: center; padding: 3rem; color: var(--muted); font-size: 0.9rem; }
  .empty { text-align: center; padding: 4rem 0; color: var(--muted); }
  .empty-icon { font-size: 3rem; margin-bottom: 0.75rem; opacity: 0.3; }
  .empty p { font-size: 0.9rem; }

  .movie-list { display: flex; flex-direction: column; gap: 0.6rem; }
  .movie-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: stretch; overflow: hidden; transition: border-color 0.15s; animation: slideIn 0.25s ease; }
  @keyframes slideIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
  .movie-card:hover { border-color: rgba(26,23,20,0.22); }
  .movie-card.completed { background: #FAFAF7; }
  .card-poster { width: 56px; flex-shrink: 0; object-fit: cover; }
  .card-poster-ph { width: 56px; flex-shrink: 0; background: rgba(26,23,20,0.06); display:flex; align-items:center; justify-content:center; font-size:1.4rem; }
  .card-body { flex: 1; min-width: 0; padding: 0.85rem 1rem; display: flex; align-items: center; gap: 1rem; }
  .movie-num { font-family: 'DM Serif Display', serif; font-size: 1.4rem; color: rgba(26,23,20,0.15); min-width: 1.8rem; text-align: right; line-height: 1; }
  .movie-info { flex: 1; min-width: 0; }
  .movie-title { font-weight: 500; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
  .movie-card.completed .movie-title { text-decoration: line-through; color: var(--muted); }
  .movie-meta { font-size: 0.75rem; color: var(--muted); font-weight: 300; }
  .imdb-rating { display: inline-flex; align-items: center; gap: 3px; font-size: 0.72rem; color: var(--gold); font-weight: 500; margin-left: 6px; }
  .watched-label { display: inline-flex; align-items: center; gap: 3px; font-size: 0.72rem; color: var(--green); font-weight: 500; margin-left: 6px; }
  .star-row { display: flex; gap: 2px; }
  .star { font-size: 1.1rem; line-height: 1; color: #D9D3C8; user-select: none; }
  .star.interactive { cursor: pointer; transition: transform 0.1s; }
  .star.interactive:hover { transform: scale(1.2); }
  .star.lit { color: var(--gold); }
  .btn-complete { padding: 0.4rem 0.9rem; font-size: 0.8rem; font-weight: 500; font-family: 'DM Sans', sans-serif; border-radius: 5px; cursor: pointer; transition: all 0.15s; white-space: nowrap; border: 1px solid var(--border); background: transparent; color: var(--muted); }
  .btn-complete:hover { background: var(--green-light); border-color: var(--green); color: var(--green); }
  .movie-card.completed .btn-complete { background: var(--green-light); border-color: var(--green); color: var(--green); }
  .movie-card.completed .btn-complete:hover { background: #fde8e4; border-color: var(--accent); color: var(--accent); }
  .btn-delete { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 1.2rem; padding: 0.2rem 0.5rem; line-height: 1; opacity: 0.3; transition: opacity 0.15s; }
  .movie-card:hover .btn-delete { opacity: 1; }
  .btn-delete:hover { color: var(--accent); }
  .rating-label { font-size: 0.72rem; color: var(--muted); margin-right: 4px; }

  .contributors-list { display: flex; flex-direction: column; gap: 0.75rem; }
  .contributor-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 1.1rem 1.25rem; display: flex; align-items: center; gap: 1.25rem; animation: slideIn 0.25s ease; }
  .contributor-card:hover { border-color: rgba(26,23,20,0.22); }
  .contrib-rank { font-family: 'DM Serif Display', serif; font-size: 1.6rem; color: rgba(26,23,20,0.15); min-width: 2rem; text-align: center; line-height: 1; }
  .contrib-rank.gold   { color: #C9902A; }
  .contrib-rank.silver { color: #9A9A9A; }
  .contrib-rank.bronze { color: #A0674A; }
  .contrib-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--accent-light); display: flex; align-items: center; justify-content: center; font-family: 'DM Serif Display', serif; font-size: 1.1rem; color: var(--accent); flex-shrink: 0; }
  .contrib-info { flex: 1; min-width: 0; }
  .contrib-name { font-weight: 500; font-size: 1rem; margin-bottom: 4px; }
  .contrib-stats { display: flex; gap: 1rem; flex-wrap: wrap; }
  .contrib-stat { font-size: 0.75rem; color: var(--muted); }
  .contrib-stat strong { color: var(--ink); font-weight: 500; }
  .contrib-bar-wrap { width: 80px; flex-shrink: 0; }
  .contrib-bar-bg { height: 4px; background: rgba(26,23,20,0.08); border-radius: 2px; overflow: hidden; margin-top: 4px; }
  .contrib-bar-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.4s ease; }

  .name-prompt { position: fixed; inset: 0; background: rgba(26,23,20,0.5); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 1rem; }
  .name-modal { background: var(--card-bg); border-radius: 14px; padding: 2rem; max-width: 360px; width: 100%; box-shadow: 0 20px 60px rgba(26,23,20,0.2); }
  .name-modal h2 { font-family: 'DM Serif Display', serif; font-size: 1.6rem; margin-bottom: 0.5rem; }
  .name-modal p { color: var(--muted); font-size: 0.88rem; margin-bottom: 1.25rem; line-height: 1.6; }
  .name-modal input { width: 100%; padding: 0.7rem 1rem; border: 1px solid var(--border); border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; margin-bottom: 0.75rem; outline: none; background: var(--cream); color: var(--ink); }
  .name-modal input:focus { border-color: var(--accent); }
  .btn-start { width: 100%; padding: 0.75rem; background: var(--accent); color: white; border: none; border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 500; cursor: pointer; }
  .btn-start:hover { background: #a8361f; }
  .viewer-tag { display: inline-block; background: var(--accent-light); color: var(--accent); font-size: 0.75rem; font-weight: 500; padding: 0.2rem 0.6rem; border-radius: 4px; margin-left: 0.5rem; vertical-align: middle; }

  @media (max-width: 500px) {
    .movie-num, .contrib-bar-wrap { display: none; }
    .add-form { flex-direction: column; }
    .autocomplete { right: 0; }
  }
</style>
</head>
<body>

<script>
  // ── Paste your Firebase config here (safe to expose) ──
  const FB_CONFIG = {
    apiKey:            "YOUR_FIREBASE_API_KEY",
    authDomain:        "YOUR_PROJECT.firebaseapp.com",
    projectId:         "YOUR_PROJECT_ID",
    storageBucket:     "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId:             "YOUR_APP_ID"
  };

  // ── Paste your Cloud Function URLs here (no secrets, just URLs) ──
  const FN_BASE   = "YOUR_WORKER_URL";
  const FN_SEARCH = FN_BASE + "/search";
  const FN_DETAIL = FN_BASE + "/detail";
  const FN_ADMIN  = FN_BASE + "/admin";
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- Name modal -->
<div class="name-prompt" id="namePrompt">
  <div class="name-modal">
    <h2>What's your name?</h2>
    <p>So we know who recommended what.</p>
    <input type="text" id="nameInput" placeholder="Your first name…" maxlength="30" autocomplete="off">
    <button class="btn-start" onclick="saveName()">Let's go →</button>
  </div>
</div>

<!-- Admin password modal -->
<div class="admin-overlay" id="adminOverlay" style="display:none">
  <div class="admin-modal">
    <h2>🔐 Admin mode</h2>
    <p>Enter the password to unlock full controls.</p>
    <input type="password" id="adminPassInput" placeholder="Password…" autocomplete="off">
    <div class="admin-error" id="adminError"></div>
    <div class="admin-modal-btns">
      <button class="btn-admin-cancel" onclick="closeAdminPrompt()">Cancel</button>
      <button class="btn-admin-confirm" id="adminSubmitBtn" onclick="submitAdminPass()">Unlock</button>
    </div>
  </div>
</div>

<!-- Movie preview modal -->
<div class="preview-overlay" id="previewOverlay" style="display:none">
  <div class="preview-card">
    <div class="preview-inner">
      <div id="previewPosterWrap"></div>
      <div class="preview-meta">
        <h3 id="previewTitle"></h3>
        <div class="preview-tags" id="previewTags"></div>
        <p class="preview-plot" id="previewPlot"></p>
      </div>
    </div>
    <div class="preview-actions">
      <button class="btn-cancel" onclick="closePreview()">Cancel</button>
      <button class="btn-confirm" onclick="confirmAdd()">+ Add to queue</button>
    </div>
  </div>
</div>

<header>
  <h1 id="mainTitle">🎬 The Queue</h1>
  <p class="subtitle">Suggest a movie for the list. <span id="viewerName"></span></p>
  <div class="search-wrap">
    <div class="add-form">
      <input type="text" id="movieInput" placeholder="Search for a movie…" maxlength="80" autocomplete="off">
      <button class="btn-add" onclick="handleAddClick()">+ Add</button>
    </div>
    <div class="autocomplete" id="autocomplete" style="display:none"></div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" id="tabQueue"   onclick="setTab('queue',this)">Queue <span class="count-badge" id="queueCount">0</span></button>
  <button class="tab"        id="tabWatched" onclick="setTab('watched',this)">Watched <span class="count-badge" id="watchedCount">0</span></button>
  <button class="tab"        id="tabContrib" onclick="setTab('contrib',this)">Contributors <span class="count-badge" id="contribCount">0</span></button>
</div>

<div class="toolbar" id="toolbar" style="display:none"></div>

<main>
  <div class="loading" id="loading">Loading the queue…</div>
  <div id="movieList" style="display:none"></div>
  <div class="empty" id="emptyState" style="display:none">
    <div class="empty-icon">🍿</div>
    <p id="emptyText">Nothing here yet. Be the first to suggest one!</p>
  </div>
</main>

<script>
let db, unsubscribe;
let movies      = [];
let userName    = '';
let isAdmin     = false;
let adminToken  = '';
let currentTab  = 'queue';
let watchedSort = 'date';
let contribSort = 'volume';
let searchTimer = null;
let pendingMovie = null;
let titleTaps = 0, titleTimer = null;

firebase.initializeApp(FB_CONFIG);
db = firebase.firestore();

// ── Secret admin trigger: tap title 5× ───────────────────────
document.getElementById('mainTitle').addEventListener('click', () => {
  titleTaps++;
  clearTimeout(titleTimer);
  titleTimer = setTimeout(() => { titleTaps = 0; }, 2000);
  if (titleTaps >= 5) {
    titleTaps = 0;
    if (isAdmin) {
      logoutAdmin();
    } else {
      document.getElementById('adminPassInput').value = '';
      document.getElementById('adminError').textContent = '';
      document.getElementById('adminOverlay').style.display = 'flex';
      setTimeout(() => document.getElementById('adminPassInput').focus(), 100);
    }
  }
});

document.getElementById('adminPassInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitAdminPass();
  if (e.key === 'Escape') closeAdminPrompt();
});

async function submitAdminPass() {
  const btn = document.getElementById('adminSubmitBtn');
  const pass = document.getElementById('adminPassInput').value;
  btn.textContent = 'Checking…';
  btn.disabled = true;
  try {
    const r = await fetch(FN_ADMIN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass })
    });
    const data = await r.json();
    if (data.ok) {
      isAdmin    = true;
      adminToken = data.token;
      sessionStorage.setItem('mq-admin-token', adminToken);
      closeAdminPrompt();
      applyAdminUI();
      render();
    } else {
      document.getElementById('adminError').textContent = 'Wrong password.';
      document.getElementById('adminPassInput').value = '';
      document.getElementById('adminPassInput').focus();
    }
  } catch(e) {
    document.getElementById('adminError').textContent = 'Could not reach server.';
  } finally {
    btn.textContent = 'Unlock';
    btn.disabled = false;
  }
}

function closeAdminPrompt() {
  document.getElementById('adminOverlay').style.display = 'none';
}

function logoutAdmin() {
  isAdmin = false;
  adminToken = '';
  sessionStorage.removeItem('mq-admin-token');
  applyAdminUI();
  render();
}

function applyAdminUI() {
  const badge = document.getElementById('viewerName');
  const name  = userName || '';
  if (isAdmin) {
    badge.innerHTML = `<span class="viewer-tag">👤 ${esc(name)}</span><span class="admin-badge">⚡ Admin</span>`;
  } else {
    if (name) badge.innerHTML = `<span class="viewer-tag">👤 ${esc(name)}</span>`;
  }
  renderToolbar();
}

// ── Firebase ──────────────────────────────────────────────────
function startListening() {
  if (unsubscribe) unsubscribe();
  unsubscribe = db.collection('movies').orderBy('addedTs', 'desc')
    .onSnapshot(snap => {
      movies = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
      document.getElementById('loading').style.display = 'none';
      document.getElementById('movieList').style.display = 'block';
    }, err => {
      document.getElementById('loading').textContent = 'Could not connect to database.';
    });
}

// ── Name ──────────────────────────────────────────────────────
function saveName() {
  const val = document.getElementById('nameInput').value.trim();
  if (!val) return;
  userName = val;
  localStorage.setItem('mq-username', val);
  document.getElementById('namePrompt').style.display = 'none';
  applyAdminUI();
}
document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') saveName(); });

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── OMDB via Cloud Functions ──────────────────────────────────
const input = document.getElementById('movieInput');
const acBox  = document.getElementById('autocomplete');

input.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = input.value.trim();
  if (q.length < 2) { acBox.style.display = 'none'; return; }
  searchTimer = setTimeout(() => searchOMDB(q), 350);
});
input.addEventListener('keydown', e => {
  if (e.key === 'Escape') acBox.style.display = 'none';
  if (e.key === 'Enter')  handleAddClick();
});
document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) acBox.style.display = 'none';
});

async function searchOMDB(q) {
  acBox.innerHTML = '<div class="ac-searching">Searching…</div>';
  acBox.style.display = 'block';
  try {
    const r    = await fetch(`${FN_SEARCH}?q=${encodeURIComponent(q)}`);
    const data = await r.json();
    if (data.Response === 'False' || !data.Search) {
      acBox.innerHTML = '<div class="ac-searching">No results found.</div>';
      return;
    }
    acBox.innerHTML = data.Search.slice(0, 6).map(m => `
      <div class="ac-item" onclick="selectMovie('${esc(m.imdbID)}','${esc(m.Title)}','${esc(m.Year)}','${esc(m.Poster)}')">
        ${m.Poster && m.Poster !== 'N/A'
          ? `<img class="ac-poster" src="${esc(m.Poster)}" alt="">`
          : `<div class="ac-poster-placeholder">🎬</div>`}
        <div>
          <div class="ac-title">${esc(m.Title)}</div>
          <div class="ac-year">${esc(m.Year)}</div>
        </div>
      </div>`).join('');
  } catch(e) {
    acBox.innerHTML = '<div class="ac-searching">Search failed.</div>';
  }
}

async function selectMovie(imdbID, title, year, poster) {
  acBox.style.display = 'none';
  input.value = title;
  try {
    const r = await fetch(`${FN_DETAIL}?id=${encodeURIComponent(imdbID)}`);
    showPreview(await r.json());
  } catch(e) {
    showPreview({ Title: title, Year: year, Poster: poster, imdbID, Plot: '', Genre: '', imdbRating: 'N/A', Runtime: '' });
  }
}

function showPreview(d) {
  pendingMovie = d;
  document.getElementById('previewTitle').textContent = d.Title + (d.Year ? ` (${d.Year})` : '');
  document.getElementById('previewPlot').textContent  = (d.Plot && d.Plot !== 'N/A') ? d.Plot : '';
  const tags = [];
  if (d.Genre      && d.Genre      !== 'N/A') d.Genre.split(', ').forEach(g => tags.push(g));
  if (d.Runtime    && d.Runtime    !== 'N/A') tags.push(d.Runtime);
  if (d.imdbRating && d.imdbRating !== 'N/A') tags.push('⭐ ' + d.imdbRating + ' IMDb');
  document.getElementById('previewTags').innerHTML = tags.map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const pw = document.getElementById('previewPosterWrap');
  pw.innerHTML = (d.Poster && d.Poster !== 'N/A')
    ? `<img class="preview-poster" src="${esc(d.Poster)}" alt="">`
    : `<div class="preview-poster-ph">🎬</div>`;
  document.getElementById('previewOverlay').style.display = 'flex';
}

function closePreview() {
  document.getElementById('previewOverlay').style.display = 'none';
  pendingMovie = null;
}

async function confirmAdd() {
  if (!pendingMovie || !userName) {
    if (!userName) { closePreview(); document.getElementById('namePrompt').style.display = 'flex'; }
    return;
  }
  const d = pendingMovie;
  await db.collection('movies').add({
    title:       d.Title,
    year:        d.Year || '',
    poster:      (d.Poster     && d.Poster     !== 'N/A') ? d.Poster     : '',
    genre:       (d.Genre      && d.Genre      !== 'N/A') ? d.Genre      : '',
    runtime:     (d.Runtime    && d.Runtime    !== 'N/A') ? d.Runtime    : '',
    imdbRating:  (d.imdbRating && d.imdbRating !== 'N/A') ? d.imdbRating : '',
    imdbID:      d.imdbID || '',
    addedBy:     userName,
    addedAt:     new Date().toLocaleDateString('en-US', { month:'short', day:'numeric' }),
    addedTs:     firebase.firestore.FieldValue.serverTimestamp(),
    completed:   false,
    rating:      0,
    completedTs: null
  });
  input.value = '';
  closePreview();
}

function handleAddClick() {
  if (pendingMovie) confirmAdd();
}

// ── Firestore actions ─────────────────────────────────────────
async function toggleComplete(id) {
  if (!isAdmin) return;
  const m = movies.find(x => x.id === id);
  if (!m) return;
  const nowComplete = !m.completed;
  await db.collection('movies').doc(id).update({
    completed:   nowComplete,
    rating:      nowComplete ? m.rating : 0,
    completedTs: nowComplete ? firebase.firestore.FieldValue.serverTimestamp() : null
  });
}

async function setRating(id, stars) {
  if (!isAdmin) return;
  await db.collection('movies').doc(id).update({ rating: stars });
}

async function deleteMovie(id) {
  const m = movies.find(x => x.id === id);
  if (!m) return;
  if (!isAdmin && m.addedBy !== userName) return;
  await db.collection('movies').doc(id).delete();
}

// ── Tabs & toolbar ────────────────────────────────────────────
function setTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderToolbar();
  render();
}

function renderToolbar() {
  const tb = document.getElementById('toolbar');
  if (currentTab === 'watched') {
    tb.style.display = 'flex';
    tb.innerHTML = `
      <span class="sort-label">Sort by</span>
      <button class="sort-btn ${watchedSort==='date'  ?'active':''}" onclick="setWatchedSort('date')">📅 Date watched</button>
      <button class="sort-btn ${watchedSort==='rating'?'active':''}" onclick="setWatchedSort('rating')">⭐ Rating</button>`;
  } else if (currentTab === 'contrib') {
    tb.style.display = 'flex';
    tb.innerHTML = `
      <span class="sort-label">Sort by</span>
      <button class="sort-btn ${contribSort==='volume'?'active':''}" onclick="setContribSort('volume')">🎬 Most suggested</button>
      <button class="sort-btn ${contribSort==='rating'?'active':''}" onclick="setContribSort('rating')">⭐ Avg rating</button>`;
  } else {
    tb.style.display = 'none';
  }
}

function setWatchedSort(s) { watchedSort = s; renderToolbar(); render(); }
function setContribSort(s) { contribSort = s; renderToolbar(); render(); }

// ── Render ────────────────────────────────────────────────────
function render() {
  const queued  = movies.filter(m => !m.completed);
  const watched = movies.filter(m =>  m.completed);

  const contribMap = {};
  movies.forEach(m => {
    const name = m.addedBy || 'Unknown';
    if (!contribMap[name]) contribMap[name] = { name, total:0, watched:0, ratingSum:0, ratedCount:0 };
    contribMap[name].total++;
    if (m.completed) {
      contribMap[name].watched++;
      if (m.rating > 0) { contribMap[name].ratingSum += m.rating; contribMap[name].ratedCount++; }
    }
  });
  const contribs = Object.values(contribMap);

  document.getElementById('queueCount').textContent   = queued.length;
  document.getElementById('watchedCount').textContent = watched.length;
  document.getElementById('contribCount').textContent = contribs.length;

  const container = document.getElementById('movieList');
  const empty     = document.getElementById('emptyState');

  if (currentTab === 'queue') {
    renderMovieList(queued, container, empty, 'Nothing in the queue yet — add something!');
  } else if (currentTab === 'watched') {
    const sorted = [...watched].sort((a, b) => {
      if (watchedSort === 'rating') return (b.rating || 0) - (a.rating || 0);
      const ta = b.completedTs?.seconds ?? b.addedTs?.seconds ?? 0;
      const tb = a.completedTs?.seconds ?? a.addedTs?.seconds ?? 0;
      return ta - tb;
    });
    renderMovieList(sorted, container, empty, 'No watched movies yet.');
  } else {
    renderContributors(contribs, container, empty);
  }
}

function renderMovieList(list, container, empty, emptyMsg) {
  if (!list.length) {
    container.innerHTML = '';
    empty.style.display = 'block';
    document.getElementById('emptyText').textContent = emptyMsg;
    return;
  }
  empty.style.display = 'none';
  container.className = 'movie-list';

  container.innerHTML = list.map((m, i) => {
    const canDelete = isAdmin || m.addedBy === userName;
    const showWatch = isAdmin;  // only admin sees ✓ Watched / ↩ Undo

    // Stars: interactive for admin on watched tab, display-only otherwise
    const starsHtml = m.completed ? (() => {
      if (isAdmin) {
        return `
          <div style="display:flex;align-items:center;margin-top:5px;gap:4px">
            <span class="rating-label">My rating:</span>
            <div class="star-row" id="stars-${m.id}">
              ${[1,2,3,4,5].map(s => `
                <span class="star interactive${m.rating >= s ? ' lit' : ''}"
                  onclick="setRating('${m.id}',${s})"
                  onmouseover="hoverStars('${m.id}',${s})"
                  onmouseout="resetStars('${m.id}',${m.rating})"
                >★</span>`).join('')}
            </div>
          </div>`;
      } else if (m.rating > 0) {
        // Read-only star display for regular users
        return `
          <div style="display:flex;align-items:center;margin-top:5px;gap:4px">
            <span class="rating-label">Rated:</span>
            <div class="star-row">
              ${[1,2,3,4,5].map(s => `<span class="star${m.rating >= s ? ' lit' : ''}">★</span>`).join('')}
            </div>
          </div>`;
      }
      return '';
    })() : '';

    return `
    <div class="movie-card${m.completed ? ' completed' : ''}">
      ${m.poster
        ? `<img class="card-poster" src="${esc(m.poster)}" alt="" loading="lazy">`
        : `<div class="card-poster-ph">🎬</div>`}
      <div class="card-body">
        <div class="movie-num">${i + 1}</div>
        <div class="movie-info">
          <div class="movie-title">${esc(m.title)}${m.year ? ` <span style="font-weight:300;color:var(--muted);font-size:0.85em">(${esc(m.year)})</span>` : ''}</div>
          <div class="movie-meta">
            Suggested by ${esc(m.addedBy)} · ${esc(m.addedAt)}
            ${m.genre ? ` · <span style="opacity:0.7">${esc(m.genre.split(',')[0])}</span>` : ''}
            ${m.imdbRating ? `<span class="imdb-rating">★ ${esc(m.imdbRating)}</span>` : ''}
            ${m.completed && !isAdmin ? `<span class="watched-label">✓ Watched</span>` : ''}
          </div>
          ${starsHtml}
        </div>
        ${showWatch ? `
        <button class="btn-complete" onclick="toggleComplete('${m.id}')">
          ${m.completed ? '↩ Undo' : '✓ Watched'}
        </button>` : ''}
        ${canDelete ? `
        <button class="btn-delete" onclick="deleteMovie('${m.id}')" title="Remove">×</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderContributors(contribs, container, empty) {
  if (!contribs.length) {
    container.innerHTML = '';
    empty.style.display = 'block';
    document.getElementById('emptyText').textContent = 'No contributors yet.';
    return;
  }
  empty.style.display = 'none';
  container.className = 'contributors-list';

  const sorted = [...contribs].sort((a, b) => {
    if (contribSort === 'rating') {
      const ar = a.ratedCount ? a.ratingSum / a.ratedCount : 0;
      const br = b.ratedCount ? b.ratingSum / b.ratedCount : 0;
      return br - ar;
    }
    return b.total - a.total;
  });

  const maxTotal = Math.max(...sorted.map(c => c.total), 1);
  container.innerHTML = sorted.map((c, i) => {
    const avgRating = c.ratedCount ? (c.ratingSum / c.ratedCount).toFixed(1) : '—';
    const initials  = c.name.slice(0, 2).toUpperCase();
    const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    const rankLabel = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1;
    const barPct    = Math.round((c.total / maxTotal) * 100);
    return `
      <div class="contributor-card">
        <div class="contrib-rank ${rankClass}">${rankLabel}</div>
        <div class="contrib-avatar">${initials}</div>
        <div class="contrib-info">
          <div class="contrib-name">${esc(c.name)}</div>
          <div class="contrib-stats">
            <span class="contrib-stat">🎬 <strong>${c.total}</strong> suggested</span>
            <span class="contrib-stat">✅ <strong>${c.watched}</strong> watched</span>
            <span class="contrib-stat">⭐ <strong>${avgRating}</strong> avg rating</span>
          </div>
        </div>
        <div class="contrib-bar-wrap">
          <div style="font-size:0.65rem;color:var(--muted);text-align:right;margin-bottom:3px">${c.total} film${c.total!==1?'s':''}</div>
          <div class="contrib-bar-bg"><div class="contrib-bar-fill" style="width:${barPct}%"></div></div>
        </div>
      </div>`;
  }).join('');
}

function hoverStars(id, n) {
  document.getElementById('stars-' + id)?.querySelectorAll('.star')
    .forEach((s, i) => s.classList.toggle('lit', i < n));
}
function resetStars(id, rating) {
  document.getElementById('stars-' + id)?.querySelectorAll('.star')
    .forEach((s, i) => s.classList.toggle('lit', i < rating));
}

// ── Boot ──────────────────────────────────────────────────────
window.addEventListener('load', () => {
  const saved = localStorage.getItem('mq-username');
  if (saved) {
    userName = saved;
    document.getElementById('namePrompt').style.display = 'none';
  }
  const savedToken = sessionStorage.getItem('mq-admin-token');
  if (savedToken) {
    isAdmin    = true;
    adminToken = savedToken;
  }
  applyAdminUI();
  startListening();
});
</script>
